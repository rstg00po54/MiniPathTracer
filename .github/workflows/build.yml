name: C++ build and tests
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMPT_ENABLE_SDL2=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke render
        run: ./build/MiniPathTracer --headless --width 64 --height 64 --spp 4 --out cornell.ppm
  linux_sdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure interactive preview
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMPT_ENABLE_SDL2=ON | tee configure.log
          grep -q "SDL2 preview enabled" configure.log
      - name: Build SDL2 preview
        run: cmake --build build --parallel 2
      - name: Test older SDL2 CMake config (no SDL2::SDL2 target)
        run: |
          mkdir -p fake-sdl2
          printf 'set(SDL2_FOUND TRUE)\n' > fake-sdl2/SDL2Config.cmake
          cmake -S . -B build_legacy -DCMAKE_BUILD_TYPE=Release -DMPT_ENABLE_SDL2=ON -DSDL2_DIR="$PWD/fake-sdl2" | tee legacy.log
          grep -q "SDL2 preview enabled (pkg-config compatibility)" legacy.log
          cmake --build build_legacy --parallel 2
      - name: Tests
        run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DMPT_ENABLE_SDL2=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure